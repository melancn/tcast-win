name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ./TCast.Desktop.sln --configfile ./NuGet.config

      - name: Build
        run: dotnet build ./TCast.Desktop.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test ./TCast.Desktop.sln --configuration Release --no-build --no-restore --logger trx --results-directory ./artifacts/test-results

      - name: Check analyzers
        run: dotnet format analyzers ./TCast.Desktop.sln --verify-no-changes --no-restore --severity warn

      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results/**/*.trx
          if-no-files-found: warn
          retention-days: 14

      - name: Publish framework-dependent app
        run: dotnet publish ./src/TCast.Desktop/TCast.Desktop.csproj --configuration Release --runtime win-x64 --self-contained false --output ./artifacts/publish/win-x64-framework-dependent

      - name: Publish self-contained app
        run: dotnet publish ./src/TCast.Desktop/TCast.Desktop.csproj --configuration Release --runtime win-x64 --self-contained true --output ./artifacts/publish/win-x64-self-contained

      - name: Upload framework-dependent app
        uses: actions/upload-artifact@v4
        with:
          name: TCast-Desktop-win-x64-framework-dependent
          path: artifacts/publish/win-x64-framework-dependent/
          if-no-files-found: error
          retention-days: 14

      - name: Upload self-contained app
        uses: actions/upload-artifact@v4
        with:
          name: TCast-Desktop-win-x64-self-contained
          path: artifacts/publish/win-x64-self-contained/
          if-no-files-found: error
          retention-days: 14

  release:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Download framework-dependent app
        uses: actions/download-artifact@v4
        with:
          name: TCast-Desktop-win-x64-framework-dependent
          path: artifacts/publish/win-x64-framework-dependent

      - name: Download self-contained app
        uses: actions/download-artifact@v4
        with:
          name: TCast-Desktop-win-x64-self-contained
          path: artifacts/publish/win-x64-self-contained

      - name: Package release assets
        run: |
          New-Item -ItemType Directory -Path ./artifacts/release -Force | Out-Null
          Compress-Archive -Path ./artifacts/publish/win-x64-framework-dependent/* -DestinationPath ./artifacts/release/TCast-Desktop-win-x64-framework-dependent.zip -Force
          Compress-Archive -Path ./artifacts/publish/win-x64-self-contained/* -DestinationPath ./artifacts/release/TCast-Desktop-win-x64-self-contained.zip -Force

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release view "$env:RELEASE_TAG" --json tagName
          if ($LASTEXITCODE -ne 0) {
            gh release create "$env:RELEASE_TAG" --verify-tag --draft --title "$env:RELEASE_TAG" --generate-notes
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          gh release upload "$env:RELEASE_TAG" ./artifacts/release/TCast-Desktop-win-x64-framework-dependent.zip ./artifacts/release/TCast-Desktop-win-x64-self-contained.zip --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit "$env:RELEASE_TAG" --draft=false --prerelease=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
